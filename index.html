<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nico, explorador digital de El Colorado</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--dusk:#1a1430;--sun:#f6a43c;--blue:#2f4fe0;--ink:#f7ecdc;--river:#d4502e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:radial-gradient(120% 90% at 80% 20%,#3a2250 0%,var(--dusk) 60%);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;display:grid;place-items:center;padding:16px;min-height:100vh}
main{display:grid;gap:24px;align-items:center;max-width:1000px;width:100%}
@media(min-width:820px){main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:48px}}
.stage{position:relative;aspect-ratio:1202/1309;width:100%;max-height:84vh;margin:auto;border-radius:28px;overflow:hidden;box-shadow:0 24px 60px #0008;background:#000}
.fig{position:absolute;inset:0;transform-origin:58% 80%;will-change:transform}
.fig>*{position:absolute}
.base{inset:0;width:100%;height:100%}
.m{left:48.7%;top:35.3%;width:15%;height:8.86%;opacity:0}
.m.on{opacity:1}
.blink{left:47.84%;top:25.6%;width:22.46%;height:10.31%;opacity:0}
.sun{left:90.9%;top:39.1%;width:30%;aspect-ratio:1;translate:-50% -50%;background:radial-gradient(circle,#ffd98a99,transparent 65%);mix-blend-mode:screen;animation:glow 4s ease-in-out infinite;pointer-events:none}
@keyframes glow{50%{opacity:.55;scale:1.12}}
h1{font-size:clamp(2.4rem,6vw,4rem);line-height:1;margin:0 0 .4em;font-weight:800;letter-spacing:-.02em}
p{margin:0 0 1.2em;line-height:1.5;max-width:34ch;opacity:.85}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
button{font:inherit;font-weight:600;font-size:1.05rem;background:var(--blue);color:#fff;border:0;border-radius:999px;padding:.85em 1.6em;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
button.on{background:var(--river)}
#st{display:flex;align-items:center;gap:8px;font-size:.95rem}
#st i{width:10px;height:10px;border-radius:50%;background:#7c7a8c}
#st.live i{background:#58d68d}#st.talk i{background:var(--sun)}
small{display:block;margin-top:1.4em;opacity:.6;max-width:44ch;line-height:1.4}
@media(prefers-reduced-motion:reduce){.sun{animation:none}}
</style></head><body>

  if(mode==='speaking')raw=conv.getOutputVolume?.()||0; else rawIn=conv.getInputVolume?.()||0;
 }
 vol+=(raw-vol)*(raw>vol?.55:.18);          // ataque rápido, caída suave
 inv+=(rawIn-inv)*.15;
 // boca sincronizada con la voz
 const speaking=conv&&mode==='speaking';
 setM(speaking?(vol<.03?0:Math.min(4,1+Math.round(vol*6))):1);
 // movimiento del cuerpo/cabeza sincronizado con la voz
 const targetTilt=!conv?0:speaking?0:Math.min(inv*8,1);
 tilt+=(targetTilt-tilt)*.08;
 if(!calm){
  const amp=speaking?1+vol*3:1;
  const rot=Math.sin(t*.9)*.35*amp+Math.sin(t*2.3)*.15*(speaking?1:0)-tilt*.8;
  const ty=Math.sin(t*1.25)*1.6+(speaking?-vol*5:0)+tilt*2;
  const tx=Math.sin(t*.7)*1.2;
  const sc=1.03+Math.sin(t*1.25)*.004+(speaking?vol*.012:0);
  fig.style.transform=`translate(${tx}px,${ty}px) rotate(${rot}deg) scale(${sc})`;
 }else fig.style.transform='scale(1.03)';
 requestAnimationFrame(loop)
})(performance.now());
const opts={agentId:AGENT_ID,
 onConnect:()=>{btn.textContent='Terminar charla';btn.classList.add('on');say('Te escucho','live')},
 onDisconnect:()=>{conv=null;mode='idle';btn.textContent='Hablar con Nico';btn.classList.remove('on');say('Listo para charlar')},
 onModeChange:({mode:m})=>{mode=m;say(m==='speaking'?'Nico está hablando':'Te escucho',m==='speaking'?'talk':'live')},
 onError:()=>say('Se cortó la conexión. Revisá el micrófono y que el agente sea público.')};
btn.onclick=async()=>{
 if(conv){await conv.endSession();return}
 say('Conectando…');
 try{await navigator.mediaDevices.getUserMedia({audio:true})}catch{say('Permití el micrófono para charlar con Nico.');return}
 try{conv=await Conversation.startSession({...opts,connectionType:'webrtc'})}
 catch{try{conv=await Conversation.startSession({...opts,connectionType:'websocket'})}catch{say('No se pudo conectar. Revisá que el agente sea público.')}}
};
